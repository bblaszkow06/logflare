[package]
name = "s3_tables_ex"
version = "0.1.0"
edition = "2021"

[lib]
name = "s3_tables_ex"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.2"
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }
iceberg = "=0.10.1"
iceberg-catalog-s3tables = "=0.10.1"
arrow-array = "58"
arrow-json = "58"
arrow-ord = "58"
arrow-schema = "58"
arrow-select = "58"
parquet = "58"
uuid = { version = "1", features = ["v4"] }
